<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to josemasri.com</title>
  <!-- El inglés pasó de /en/ a la raíz. Este stub sobrevive solo para que los enlaces
       antiguos a /en/ no den 404 (pueden estar en el CV, LinkedIn o el índice de Google).
       Es un sitio estático: sin servidor que haga 301, la redirección va por meta refresh.
       canonical -> / y noindex para que no compita con la raíz en buscadores. -->
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://josemasri.com/" />
  <meta http-equiv="refresh" content="0; url=../" />
  <script>location.replace('../');</script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-content: center;
           background: #121430; color: #EEF0FF; text-align: center;
           font-family: system-ui, sans-serif; padding: 24px; }
    a { color: #8FA6FF; }
  </style>
</head>
<body>
  <p>This page moved to <a href="../">josemasri.com</a>.</p>
</body>
</html>
